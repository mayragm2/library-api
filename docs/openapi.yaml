# Contrato de la Library API, en formato OpenAPI 3.0.
# Se sirve en http://localhost:3000/docs con Swagger UI. Guardá el archivo y recargá la página.
#
# Regla de toda la clase: el contrato de un endpoint se escribe ACÁ antes de programarlo.

openapi: 3.0.3

info:
  title: Library API
  version: 1.0.0
  description: |
    Books, authors, loans and users of a library.

    **Conventions**
    - All requests and responses are JSON.
    - Dates use the `YYYY-MM-DD` format.
    - All errors have the shape `{ "error": "..." }` (see the `Error` schema).

servers:
  - url: http://localhost:3000

# No endpoint requires a token yet. Add `security: [{ bearerAuth: [] }]` per operation when they do.
security: []

tags:
  - name: Auth
  - name: Authors
  - name: Books

paths:
  /auth/signup:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUser"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Missing field, invalid role or non-string value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Role must be either user or admin
  /auth/login:
    post:
      summary: Authenticate a user and get a JWT (valid for 1 hour)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials or no users registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Invalid credentials
        "503":
          description: Authentication service failed (JWT secret not configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Authentication service failed

  /authors:
    get:
      summary: Get the list of authors
      tags: [Authors]
      responses:
        "200":
          description: List of authors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authors"
  /authors/{id}:
    get:
      summary: Get an author by id
      tags: [Authors]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Author found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
        "400":
          description: Id is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: ID is not a number
        "404":
          description: Author not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Author not found
    delete:
      summary: Delete an author (only if it has no books)
      tags: [Authors]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Author deleted
        "400":
          description: Id is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: ID is not a number
        "404":
          description: Author not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Author not found
        "409":
          description: Author has books
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Cannot delete author that has books

  /books:
    get:
      summary: Search books with filters and pagination
      tags: [Books]
      parameters:
        - name: title
          in: query
          schema: { type: string }
        - name: available
          in: query
          schema: { type: boolean }
        - name: author_id
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 10 }
      responses:
        "200":
          description: Page of books
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookPage"
        "400":
          description: Invalid query param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a book
      tags: [Books]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBook"
      responses:
        "201":
          description: Book created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          description: Year or author id is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Author not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Author not found

  /books/{id}:
    get:
      summary: Get a book by id
      tags: [Books]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Book found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          description: Id is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: ID is not a number
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Book not found
    put:
      summary: Replace all fields of a book
      tags: [Books]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBook"
      responses:
        "200":
          description: Book replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          description: Id is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: ID is not a number
        "404":
          description: Book or author not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Book not found
    patch:
      summary: Update some fields of a book
      tags: [Books]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBook"
      responses:
        "200":
          description: Book updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          description: Id is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: ID is not a number
        "404":
          description: Book or author not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Book not found
    delete:
      summary: Delete a book (only if it was never loaned)
      tags: [Books]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Book deleted
        "400":
          description: Id is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: ID is not a number
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Book not found
        "409":
          description: Book has loans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Book has loans

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Book not found
    Date:
      type: string
      format: date
      description: YYYY-MM-DD
      example: "2026-04-02"

    # ── Auth ──
    NewUser:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 200
          example: mayra@example.com
        password:
          type: string
          format: password
          example: s3cret-pass
        role:
          type: string
          enum: [user, admin]
          example: user
    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: mayra@example.com
        role:
          type: string
          enum: [user, admin]
          example: user
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: mayra@example.com
        password:
          type: string
          format: password
          example: s3cret-pass
    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: JWT with claims `email` and `role`, expires in 1 hour
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    # ── Authors ──
    Author:
      type: object
      required: [id, name, nationality]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          maxLength: 100
          example: Julian Kartun
        nationality:
          type: string
          maxLength: 50
          example: Argentino
    Authors:
      type: array
      items:
        $ref: "#/components/schemas/Author"

    # ── Books ──
    NewBook:
      type: object
      required: [title, year, author_id]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Harry Potter and the Philosopher's Stone
        year:
          type: integer
          minimum: 1000
          maximum: 2100
          example: 1997
        author_id:
          type: integer
          example: 2
    UpdateBook:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Harry Potter and the Philosopher's Stone
        year:
          type: integer
          minimum: 1000
          maximum: 2100
          example: 1997
        author_id:
          type: integer
          example: 2
    Book:
      type: object
      required: [id, title, year, author_id, available]
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Harry Potter and the Philosopher's Stone
        year:
          type: integer
          example: 1997
        author_id:
          type: integer
          example: 2
        available:
          type: boolean
          example: false
    BookPage:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Book"
        total:
          type: integer
          example: 650
        page:
          type: integer
          example: 5
        limit:
          type: integer
          example: 10

    # ── Loans ──
    Loan:
      type: object
      required: [id, book_id, member_name, loan_date, return_date]
      properties:
        id:
          type: integer
          example: 1
        book_id:
          type: integer
          example: 5
        member_name:
          type: string
          maxLength: 100
          example: Charles
        loan_date:
          $ref: "#/components/schemas/Date"
        return_date:
          type: string
          format: date
          nullable: true
          example: "2026-09-12"
          description: null while the book has not been returned
    NewLoan:
      type: object
      required: [book_id, member_name]
      properties:
        book_id:
          type: integer
          example: 5
        member_name:
          type: string
          maxLength: 100
          example: Charles
